<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Life Roleplay</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F2F5FB;--ink:#0A1633;--ink-2:#44506E;--accent:#2457F5;--accent-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#070D1F;--ink:#E8EDFB;--ink-2:#9AA7C7;--accent:#6C90FF;--accent-ink:#071030;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:34rem}
.code{font:900 clamp(5rem,26vw,10rem)/.85 "Arial Narrow",Impact,sans-serif;color:var(--accent);letter-spacing:-.01em}
h1{margin:.6rem 0 0;font-size:1.6rem;line-height:1.2}
p{margin:.8rem 0 0;color:var(--ink-2)}
a.btn{display:inline-block;margin-top:1.5rem;padding:.8rem 1.3rem;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>El enlace que seguiste no lleva a ninguna parte de la normativa de Life Roleplay. Vuelve al inicio para ver todas las reglas del servidor.</p>
  <a class="btn" href="/">Ir a las normativas</a>
</main>
</body>
</html>
